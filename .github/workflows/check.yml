name: Check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - name: Install reviewed dependencies
        run: pnpm install --frozen-lockfile
      - name: Static checks and behavior tests
        run: pnpm run check
      - name: App-adapter contract conformance
        run: pnpm run test:conformance
      - name: Build the shell and federated test apps
        run: pnpm run build:test-apps
      - name: Install browser for integration tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser integration
        run: pnpm run test:browser
      - name: Production browser mount-isolation evidence
        run: pnpm run test:browser:production
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-browser-results
          path: |
            test-results-production-browser/
            playwright-report-production-browser/
          retention-days: 7
